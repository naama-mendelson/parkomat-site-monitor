# ============================================================
# Parkomat — הרצה בשרת
# ============================================================
# שירות אחד בלבד: Postgres (Supabase) ו-MQTT (HiveMQ) הם שירותים מנוהלים
# חיצוניים, ולכן אין כאן קונטיינר DB או broker.
#
# ⚠️ אין להריץ יותר ממופע אחד (בלי replicas / scale). שתי סיבות:
#   1. ה-Master מתחבר ל-HiveMQ עם MASTER_CLIENT_ID קבוע ו-clean:false, כדי
#      שהברוקר ישמור הודעות בזמן שהוא למטה. שני מופעים עם אותו מזהה מנתקים
#      זה את זה בלולאה — ואף אחד לא קולט.
#   2. הקליטה מסודרת בתור FIFO *לכל אתר, בתוך התהליך*. עיבוד מקביל כבר
#      השחית נתונים בעבר (מקטעי מצב כפולים, משכים שליליים).

services:
  parkomat:
    # ============================================================
    # ⚠️ שלושת ה-VITE הם ארגומנטי **בנייה**, לא משתני ריצה
    # ============================================================
    # Vite מטמיע את הערכים לתוך קובץ ה-JS בזמן הבנייה. הצבתם תחת env_file
    # למטה **לא תעשה כלום** — החבילה כבר נבנתה, והדשבורד יאמר "האימות אינו
    # מוגדר". זו הטעות הקלה ביותר לעשות כאן, והיא נראית כמו תקלת התחברות.
    #
    # ⚠️ ומכאן נובע דבר שני: **שינוי ערך מחייב `--build`.** `docker compose up
    # -d` בלבד ישתמש בתמונה הקיימת ולא יבנה מחדש, ואז הערך הישן נשאר.
    #
    #     docker compose up -d --build
    #
    # הערכים מגיעים מאותו .env — Compose קורא ממנו גם ל-${...} וגם ל-env_file.
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        # ⚠️ ה-publishable/anon בלבד. ה-secret עוקף RLS, והוא היה נצרב לקובץ
        # JS שכל דפדפן מוריד.
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
        # "false" = תוכנית ב': הדשבורד קורא דרך השרת במקום ישירות מ-Supabase.
        VITE_SUPABASE_DIRECT: ${VITE_SUPABASE_DIRECT:-true}

    image: parkomat:latest
    container_name: parkomat
    restart: unless-stopped

    # ============================================================
    # init + stop_grace_period — שניהם על כיבוי מסודר
    # ============================================================
    # init: true מכניס tini כ-PID 1. node אכן מקבל SIGTERM ישירות גם בלעדיו,
    # אבל PID 1 אמיתי גם קוצר תהליכי zombie ומעביר אותות נכון — וזה הרגל
    # נכון לשרת שאמור לרוץ שנים בלי שאיש נוגע בו.
    init: true

    # ברירת המחדל של Docker היא 10 שניות בין SIGTERM ל-SIGKILL. הכיבוי כאן
    # סוגר MQTT, חיבורי SSE, שרת HTTP ואת ה-pool — הכול מול רשת, עם דדליין
    # פנימי של 12 שניות (ראה master.js). 30 שניות נותנות לזה לגמור בשקט
    # במקום להיהרג באמצע.
    stop_grace_period: 30s

    # שמאל = הפורט בשרת, ימין = בתוך הקונטיינר.
    # מאחורי reverse proxy (nginx/Caddy) עדיף "127.0.0.1:4000:4000".
    ports:
      - "4000:4000"

    # הסודות מגיעים מקובץ .env שיושב לצד ה-compose ואינו נכנס ל-git
    # ולא לתמונה (ראה .dockerignore). ראה .env.docker.example.
    env_file:
      - .env

    # ============================================================
    # הקשחה — אפשרית כאן כי הקונטיינר אינו כותב כלום
    # ============================================================
    # ⚠️ נבדק לפני שהודלק: הגיבוי המקומי הוא no-op מאז המעבר ל-Supabase
    # (tools/backup-db.js), הלוגים הולכים ל-stdout, ואין קובץ מצב. לכן
    # מערכת קבצים לקריאה בלבד אינה שוברת דבר — ובאפליקציה שכן כותבת היא
    # הייתה מפילה אותה בעלייה.
    #
    # מה זה קונה: תוקף שמצליח להריץ קוד בתהליך אינו יכול להשאיר אחריו
    # קובץ — לא webshell, לא בינארי, ולא שינוי בקוד שרץ.
    read_only: true

    # /tmp נשאר כתיב אבל בזיכרון: Node כותב לשם קבצים זמניים במקרים מסוימים
    # (למשל דוחות קריסה), ו-noexec מונע הרצה של מה שנכתב שם.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

    security_opt:
      # מונע העלאת הרשאות דרך setuid — התהליך רץ כ-node ואין לו סיבה לעלות.
      - no-new-privileges:true

    # ⚠️ אפס יכולות. השרת מאזין על 4000 (מעל 1024), ולכן אינו זקוק אפילו
    # ל-NET_BIND_SERVICE. כל יכולת שנשארת היא יכולת שאפשר לנצל.
    cap_drop:
      - ALL

    # ============================================================
    # תקרת זיכרון — הופכת דליפה מהשבתת שרת לאתחול קונטיינר
    # ============================================================
    # ⚠️ יש כאן סיכון מתועד: המעבר בזיכרון הוא O(אתרים × דליים × פעולות),
    # ונמדד ש-200 אתרים × 365 יום חוסמים את לולאת האירועים ל-26 שניות.
    # בלי תקרה, זינוק זיכרון לוקח איתו את **המארח כולו** ואת כל מה שרץ בו.
    # עם תקרה — הקונטיינר נהרג, ו-restart: unless-stopped מרים אותו, וההודעות
    # ממתינות ב-HiveMQ.
    #
    # 512m נדיב פי כמה מהצריכה בפועל (12 אתרים), ומשאיר מקום לגדילה.
    mem_limit: 512m
    cpus: 1.0

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
