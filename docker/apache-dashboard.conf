# docker/apache-dashboard.conf — הגשת הדשבורד כאפליקציית עמוד יחיד.

<Directory "/usr/local/apache2/htdocs">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted

    # ============================================================
    # נפילה חזרה ל-index.html — בלי זה רענון עמוק מחזיר 404
    # ============================================================
    # ⚠️ הדשבורד הוא SPA: הניתוב קורה **בדפדפן**, ולשרת אין קבצים בשמות
    # האלה. טעינה ראשונה של "/" עובדת תמיד, ולכן הכשל מתגלה רק כשמישהו
    # מרענן במסך פנימי או שומר קישור — והוא נראה כמו "הדף נמחק".
    #
    # שני התנאים חיוניים: מגישים קובץ אמיתי אם הוא קיים, ורק מה שאינו
    # קיים מנותב ל-index.html.
    RewriteEngine On
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ /index.html [L]
</Directory>

# ============================================================
# מטמון: הנכסים לנצח, index.html לעולם לא
# ============================================================
# ⚠️ **זה הזוג שקובע אם עדכון בכלל מגיע למסך.** Vite מייצר שמות עם חתימה
# (index-CWUdIF8w.js), ולכן כל שינוי בתוכן משנה את שם הקובץ — אפשר לשמור
# אותם שנה בלי סיכון.
#
# index.html הוא ההפך: שמו קבוע והוא זה שמפנה לנכסים החדשים. מטמון עליו
# פירושו שהדפדפן ימשיך לטעון את הגרסה הישנה **אחרי** פריסה מוצלחת —
# ומי שיבדוק יראה מסך ישן בלי שום סימן שמשהו לא בסדר.
<FilesMatch "\.(js|css|woff2?|png|jpg|svg|ico)$">
    Header set Cache-Control "public, max-age=31536000, immutable"
</FilesMatch>

<FilesMatch "^index\.html$">
    Header set Cache-Control "no-store, must-revalidate"
</FilesMatch>

# דחיסה — הנכסים הם טקסט, והחיסכון משמעותי.
AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml

# ============================================================
# כותרות אבטחה
# ============================================================
# ⚠️ **אין כאן CSP בכוונה.** הדשבורד פונה ל-Supabase ולשרת ה-API בכתובות
# שמשתנות בין סביבות; CSP שנכתב כאן בקשיחות היה חוסם אחת מהן בלי שום
# הודעה מועילה — המסך פשוט נשאר ריק. הוא שייך לתצורה, לא לתמונה.
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "strict-origin-when-cross-origin"

ServerTokens Prod
ServerSignature Off
